# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Pages serves the result at the custom domain in dist/CNAME (univabio.org),
# which is generated from SITE_ORIGIN in vite.config.ts. To move the site to a
# different domain, change SITE_ORIGIN and the CNAME follows.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Fails the deploy if a page is missing its preview tags or points at a
      # card that is not in the build.
      - run: npm run check:preview

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
