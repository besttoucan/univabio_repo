<!doctype html>
<!--
  Source for public/og.png, the 1200x630 social share card. Regenerate with:

    npm run og

  which screenshots this file headlessly. Keep the colors and type in sync with
  src/styles/base.css; the helix geometry below is the same formula as
  src/marks/HelixBand.tsx.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&amp;family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&amp;family=Spline+Sans+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #0e0716;
        --cream: #f4ecff;
        --lilac: #c0a6ff;
        --magenta: #ff5f8f;
        --lava: #ff9142;
        --line: rgba(192, 166, 255, 0.24);
        --wonk: "SOFT" 30, "WONK" 1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--void);
        color: var(--cream);
        font-family: "Archivo", sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* a still frame of the page's lava lamp */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(440px 340px at 88% 16%, rgba(255, 95, 143, 0.5), transparent 68%),
          radial-gradient(380px 320px at 14% 74%, rgba(192, 166, 255, 0.36), transparent 70%),
          radial-gradient(320px 280px at 64% 104%, rgba(255, 145, 66, 0.34), transparent 70%);
      }

      .top {
        position: relative;
        z-index: 1;
        flex: 1;
        padding: 62px 68px 0;
      }

      .band {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Fraunces", serif;
        font-variation-settings: var(--wonk);
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.03em;
      }

      .brand svg {
        width: 28px;
        height: 28px;
      }

      h1 {
        margin: 46px 0 0;
        font-family: "Fraunces", serif;
        font-variation-settings: var(--wonk);
        font-weight: 700;
        font-size: 88px;
        line-height: 0.98;
        letter-spacing: -0.04em;
        max-width: 15ch;
      }

      h1 em {
        font-style: normal;
        color: var(--lava);
      }

      .facts {
        display: flex;
        gap: 34px;
        margin-top: 40px;
        font-family: "Spline Sans Mono", monospace;
        font-size: 19px;
        letter-spacing: 0.04em;
        color: var(--lilac);
      }

      .facts b {
        font-weight: 500;
        color: var(--cream);
      }

      .band {
        height: 150px;
        border-top: 1px solid var(--line);
        background: rgba(42, 23, 69, 0.45);
        overflow: hidden;
      }

      .band svg {
        display: block;
        width: 100%;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c0a6ff" stroke-width="1.7" stroke-linecap="round">
          <path d="M1.4 12C3.2 6.3 5.9 6.3 7.6 12C9.3 17.7 12 17.7 13.8 12" />
          <rect x="14.6" y="8.4" width="7.6" height="7.6" />
          <rect x="16.9" y="10.7" width="3" height="3" fill="#ff5f8f" stroke="none" />
        </svg>
        UnivaBio
      </div>

      <h1>Artificial intelligence <em>for human health.</em></h1>

      <div class="facts">
        <span><b>Online</b> worldwide</span>
        <span><b>Students</b> 13+</span>
        <span>Closes <b>Oct 6, 2026</b></span>
        <span><b>$40,000</b> in prizes</span>
      </div>
    </div>

    <div class="band"><svg id="band" viewBox="0 0 1200 200" preserveAspectRatio="xMaxYMid slice"></svg></div>

    <script>
      // Same geometry as src/marks/HelixBand.tsx.
      const WIDTH = 1200, CENTER_Y = 100, AMPLITUDE = 58, WAVELENGTH = 210;
      const MERGE_X = 840, CHIP_X = 1004, CHIP = 64;
      const K = (2 * Math.PI) / WAVELENGTH;

      const amp = (x) => {
        if (x >= MERGE_X) return 0;
        const t = 1 - x / MERGE_X;
        return AMPLITUDE * t * t * (3 - 2 * t);
      };

      const strand = (sign) => {
        const pts = [];
        for (let x = 0; x <= MERGE_X; x += 4) {
          pts.push(`${x.toFixed(1)} ${(CENTER_Y + sign * amp(x) * Math.sin(K * x)).toFixed(1)}`);
        }
        return "M" + pts.join(" L");
      };

      const parts = [
        `<path d="${strand(1)}" />`,
        `<path d="${strand(-1)}" />`,
      ];

      for (let x = WAVELENGTH / 4; x < MERGE_X; x += WAVELENGTH / 2) {
        const offset = Math.abs(amp(x) * Math.sin(K * x));
        if (offset < 7) continue;
        const top = CENTER_Y - offset, bottom = CENTER_Y + offset;
        parts.push(`<path d="M${x} ${top.toFixed(1)}V${bottom.toFixed(1)}" stroke="#c0a6ff" />`);
        parts.push(`<rect x="${x - 3}" y="${top - 3}" width="6" height="6" fill="#c0a6ff" stroke="none" />`);
        parts.push(`<rect x="${x - 3}" y="${bottom - 3}" width="6" height="6" fill="#c0a6ff" stroke="none" />`);
      }

      parts.push(`<rect x="${MERGE_X - 4}" y="${CENTER_Y - 4}" width="8" height="8" fill="#ff5f8f" stroke="none" />`);
      parts.push(`<path d="M${MERGE_X} ${CENTER_Y}H${CHIP_X}" />`);
      parts.push(`<rect x="${CHIP_X}" y="${CENTER_Y - CHIP / 2}" width="${CHIP}" height="${CHIP}" />`);
      parts.push(`<rect x="${CHIP_X + 22}" y="${CENTER_Y - 10}" width="20" height="20" fill="#c0a6ff" stroke="none" />`);
      for (const dx of [18, 46]) {
        parts.push(`<path d="M${CHIP_X + dx} ${CENTER_Y - CHIP / 2}V${CENTER_Y - CHIP / 2 - 16}" />`);
        parts.push(`<path d="M${CHIP_X + dx} ${CENTER_Y + CHIP / 2}V${CENTER_Y + CHIP / 2 + 16}" />`);
      }
      parts.push(`<path d="M${CHIP_X + CHIP} ${CENTER_Y}H${CHIP_X + CHIP + 22}" />`);

      const band = document.getElementById("band");
      band.setAttribute("fill", "none");
      band.setAttribute("stroke", "#c0a6ff");
      band.setAttribute("stroke-width", "1.6");
      band.setAttribute("stroke-linecap", "round");
      band.innerHTML = parts.join("");
    </script>
  </body>
</html>
